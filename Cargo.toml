[package]
name = "patent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "A prior-art search for your code ideas — has this dev tool already been shipped?"
repository = "https://github.com/riad/patent"
readme = "README.md"
keywords = ["search", "cli", "prior-art", "semantic-search", "dev-tools"]
categories = ["command-line-utilities"]

[lib]
name = "patent"
path = "src/lib.rs"

[[bin]]
name = "patent"
path = "src/bin/patent/main.rs"

[dependencies]
# CLI / runtime
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
async-trait = "0.1"

# HTTP + serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "2"

# Ranking (M3) — semantic embeddings, model downloads on first run
# fastembed = "4"

# TUI (M5)
# ratatui = "0.29"
# crossterm = "0.28"
# open = "5"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
